<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>TASYA PUNYAKU 💖🔥</title>
<style>
body{
  margin:0;
  height:100vh;
  font-family:'Comic Sans MS',cursive;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
  transition:0.5s;
}
.dark{
  background:linear-gradient(135deg,#1e1e2f,#3a3a5f);
  color:white;
}
.box{
  background:white;
  padding:30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
  max-width:360px;
}
.dark .box{background:#2a2a40}
h1{color:#ff2f6d}
button{
  margin:8px;
  padding:12px 18px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
  transition:.3s;
}
button:hover{transform:scale(1.1)}
.runaway{position:absolute}
.emoji{
  position:absolute;
  font-size:28px;
  animation:float 4s linear infinite;
}
@keyframes float{
  from{transform:translateY(100vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}
.confetti{
  position:absolute;
  width:10px;height:10px;
  background:random;
  animation:conf 2s linear infinite;
}
@keyframes conf{
  from{transform:translateY(0)}
  to{transform:translateY(100vh)}
}
</style>
</head>
<body>

<audio id="music" autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>

<div class="box">
  <h1 id="title">HALO SAYANGKU 💖</h1>
  <p id="text">SEMOGA HARI INI DAN HARI SETERUSNYA KAMU TETAP MENJADI WANITA YANG SANGAT KUAT YA SAYANGKU🔥</p>

  <button onclick="ubahTeks()">Klik Lagi 😈</button>
  <button onclick="mode()">Mode Malam 🌙</button>
  <button onclick="gantiLagu()">Ganti Lagu 🎵</button>
</div>

<button class="runaway" id="kabur">JANGAN KLIK 🤭</button>

<script>
const teks=[
 "SEMANGAT TERUS YA TASYA PACALKU 🫂🤍",
 "CAPEK BOLEH, NYERAH JANGAN 😤",
 "KAMU PASTI CAPEK BANGET HARI INI✨",
 "AKU BANGGA SAMA KAMU 💌🥺",
 "INI WEBSITE RESMI PENYEMANGAT TASYAKU 💘"
];
function ubahTeks(){
  document.getElementById("text").innerText=
  teks[Math.floor(Math.random()*teks.length)];
  spawn();
}
function mode(){
  document.body.classList.toggle("dark");
}
function gantiLagu(){
  const m=document.getElementById("music");
  m.src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3";
  m.play();
}
const btn=document.getElementById("kabur");
btn.onmouseover=()=>{
  btn.style.left=Math.random()*80+"vw";
  btn.style.top=Math.random()*80+"vh";
}
function spawn(){
  const e=document.createElement("div");
  e.className="emoji";
  e.innerText=["💖","🔥","🤯","😆","💘","✨"][Math.floor(Math.random()*6)];
  e.style.left=Math.random()*100+"vw";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),4000);
}
</script>

</body>
</html>
